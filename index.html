<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ZENTO｜店舗・飲食店向けHP制作">
  <title>ZENTO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {theme:{extend:{colors:{primary:'#8A5A3B',secondary:'#E8DED0',accent:'#C7794F',ink:'#27231F',paper:'#F8F5F0',muted:'#756E67'},fontFamily:{sans:['Noto Sans JP','sans-serif'],display:['Playfair Display','serif']}}}};
  </script>
  <style>
    :root{--primary:#8A5A3B;--accent:#C7794F;--paper:#F8F5F0;--ink:#27231F}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--paper);font-family:'Noto Sans JP',sans-serif}img{display:block;width:100%}.header-scrolled{background:rgba(248,245,240,.94);box-shadow:0 8px 30px rgba(39,35,31,.08);backdrop-filter:blur(12px)}.nav-link{position:relative;transition:color .25s ease}.nav-link::after{content:"";position:absolute;left:0;bottom:-7px;width:0;height:2px;background:var(--accent);transition:width .25s ease}.nav-link:hover{color:var(--primary)}.nav-link:hover::after{width:100%}.hero{min-height:88vh;background-position:center;background-size:cover;position:relative;isolation:isolate}.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.65),rgba(0,0,0,.25),rgba(0,0,0,.05));z-index:-1}.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}.reveal.is-visible{opacity:1;transform:translateY(0)}.feature-card,.menu-card,.news-card{transition:transform .3s ease,box-shadow .3s ease}.feature-card:hover,.menu-card:hover{transform:translateY(-6px);box-shadow:0 18px 45px rgba(39,35,31,.12)}.menu-panel{display:none}.menu-panel.active{display:block}.map-placeholder{min-height:340px;background:linear-gradient(rgba(255,255,255,.72),rgba(255,255,255,.72)),repeating-linear-gradient(45deg,#ddd 0,#ddd 2px,transparent 2px,transparent 28px)}input,textarea{outline:none;transition:border-color .2s ease,box-shadow .2s ease}input:focus,textarea:focus{border-color:var(--primary)!important;box-shadow:0 0 0 3px rgba(138,90,59,.12)}.mobile-menu{max-height:0;overflow:hidden;transition:max-height .35s ease}.mobile-menu.open{max-height:420px}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<header id="header" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"><div class="max-w-7xl mx-auto px-5 md:px-8"><div class="h-20 flex items-center justify-between"><a href="#top" id="logo" class="font-bold text-lg md:text-xl tracking-wide"></a><nav class="hidden md:flex items-center gap-8 text-sm font-medium"><a href="#concept" class="nav-link">コンセプト</a><a href="#features" class="nav-link">こだわり</a><a href="#menu" class="nav-link">メニュー</a><a href="#gallery" class="nav-link">ギャラリー</a><a href="#news" class="nav-link">お知らせ</a><a href="#access" class="nav-link">アクセス</a></nav><a href="#contact" class="hidden md:inline-flex bg-primary text-white px-5 py-3 rounded-full text-sm font-bold hover:opacity-90 transition">お問い合わせ</a><button id="menuButton" class="md:hidden p-2" aria-label="メニューを開く"><span class="block w-6 h-0.5 bg-ink mb-1.5"></span><span class="block w-6 h-0.5 bg-ink mb-1.5"></span><span class="block w-6 h-0.5 bg-ink"></span></button></div><div id="mobileMenu" class="mobile-menu md:hidden bg-paper"><nav class="py-3 pb-5 flex flex-col"><a href="#concept" class="px-2 py-3">コンセプト</a><a href="#features" class="px-2 py-3">こだわり</a><a href="#menu" class="px-2 py-3">メニュー</a><a href="#gallery" class="px-2 py-3">ギャラリー</a><a href="#news" class="px-2 py-3">お知らせ</a><a href="#access" class="px-2 py-3">アクセス</a><a href="#contact" class="mt-2 bg-primary text-white text-center px-5 py-3 rounded-full">お問い合わせ</a></nav></div></div></header>
<main id="top" class="pt-20">
<section id="hero" class="hero flex items-center"><div class="max-w-7xl mx-auto px-5 md:px-8 w-full"><div class="max-w-3xl text-white"><p id="heroSubcopy" class="font-display text-xl md:text-2xl"></p><h1 id="heroCatchcopy" class="text-4xl md:text-6xl font-bold leading-tight mt-4"></h1><p id="heroDescription" class="text-white/85 leading-8 mt-6 max-w-2xl"></p></div></div></section>
<section id="concept" class="py-24"><div class="max-w-5xl mx-auto px-5 md:px-8"><p class="text-accent font-display">CONCEPT</p><h2 class="text-3xl md:text-4xl font-bold mt-3">ZENTOについて</h2><p id="conceptText" class="text-muted leading-8 mt-8 text-lg"></p></div></section>
<section id="features" class="py-24 bg-white"><div class="max-w-7xl mx-auto px-5 md:px-8"><p class="text-accent font-display">FEATURES</p><h2 class="text-3xl md:text-4xl font-bold mt-3">こだわり</h2><div id="featureList" class="grid md:grid-cols-3 gap-6 mt-12"></div></div></section>
<section id="menu" class="py-24"><div class="max-w-7xl mx-auto px-5 md:px-8"><p class="text-accent font-display">MENU</p><h2 class="text-3xl md:text-4xl font-bold mt-3">メニュー</h2><div id="menuTabs" class="flex flex-wrap gap-3 mt-10"></div><div id="menuPanels" class="mt-8"></div></div></section>
<section id="gallery" class="py-24 bg-white"><div class="max-w-7xl mx-auto px-5 md:px-8"><p class="text-accent font-display">GALLERY</p><h2 class="text-3xl md:text-4xl font-bold mt-3">ギャラリー</h2><div id="galleryList" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-12"></div></div></section>
<section id="news" class="py-24"><div class="max-w-5xl mx-auto px-5 md:px-8"><p class="text-accent font-display">NEWS</p><h2 class="text-3xl md:text-4xl font-bold mt-3">お知らせ</h2><div id="newsList" class="mt-8 divide-y divide-black/10"></div></div></section>
<section id="access" class="py-24 bg-white"><div class="max-w-7xl mx-auto px-5 md:px-8"><p class="text-accent font-display">ACCESS</p><h2 class="text-3xl md:text-4xl font-bold mt-3">アクセス</h2><div class="grid md:grid-cols-2 gap-12 mt-12"><div><h3 id="accessName" class="text-2xl font-bold"></h3><dl class="mt-6 space-y-4"><div><dt class="font-bold">住所</dt><dd id="address" class="text-muted mt-1"></dd></div><div><dt class="font-bold">電話</dt><dd id="phone" class="text-muted mt-1"></dd></div><div><dt class="font-bold">営業時間</dt><dd id="hours" class="text-muted mt-1"></dd></div><div><dt class="font-bold">定休日</dt><dd id="closed" class="text-muted mt-1"></dd></div><div><dt class="font-bold">駐車場</dt><dd id="parking" class="text-muted mt-1"></dd></div></dl><a id="mapLink" href="#" target="_blank" rel="noopener" class="inline-flex mt-8 bg-primary text-white px-6 py-3 rounded-full font-bold">Google Mapsを見る</a></div><div class="map-placeholder rounded-3xl flex items-center justify-center text-muted">MAP</div></div></div></section>
<section id="contact" class="py-24"><div class="max-w-5xl mx-auto px-5 md:px-8"><p class="text-accent font-display">CONTACT</p><h2 class="text-3xl md:text-4xl font-bold mt-3">お問い合わせ</h2><div class="mt-10 space-y-4"><a id="contactPhone" class="block text-2xl font-bold" href="#"><span id="contactPhoneText"></span></a><a id="contactEmail" class="block text-lg underline" href="#"><span id="contactEmailText"></span></a></div></div></section>
</main>
<footer class="bg-ink text-white py-10"><div class="max-w-7xl mx-auto px-5 md:px-8 flex flex-col md:flex-row justify-between gap-4"><p id="footerName" class="font-bold"></p><p class="text-white/60">© <span id="year"></span> <span id="copyrightName"></span></p></div></footer>
<button id="backToTop" class="fixed bottom-6 right-6 w-12 h-12 rounded-full bg-primary text-white opacity-0 pointer-events-none transition" aria-label="トップへ戻る">↑</button>
<script type="module">
import STORE from './data/site.js';

document.addEventListener('DOMContentLoaded', () => {
  document.title = STORE.name;
  document.getElementById('logo').textContent = STORE.shortName;
  document.getElementById('footerName').textContent = STORE.name;
  document.getElementById('copyrightName').textContent = STORE.name;
  const hero=document.getElementById('hero'); hero.style.backgroundImage=`url("${STORE.images.hero}")`;
  document.getElementById('heroSubcopy').textContent=STORE.subcopy;
  document.getElementById('heroCatchcopy').textContent=STORE.catchcopy;
  document.getElementById('heroDescription').textContent=STORE.description;
  document.getElementById('conceptText').textContent=STORE.description;
  const featureList=document.getElementById('featureList'); STORE.features.forEach(feature=>{const article=document.createElement('article');article.className='feature-card bg-paper rounded-3xl overflow-hidden reveal';article.innerHTML=`<img src="${feature.image}" alt="${feature.title}" class="h-64 object-cover"><div class="p-7"><p class="text-accent font-display text-2xl">${feature.number}</p><h3 class="text-xl font-bold mt-3">${feature.title}</h3><p class="text-muted leading-7 mt-4">${feature.text}</p></div>`;featureList.appendChild(article)});
  const menuTabs=document.getElementById('menuTabs'),menuPanels=document.getElementById('menuPanels'); STORE.menuCategories.forEach((category,index)=>{const tab=document.createElement('button');tab.className=`menu-tab px-6 py-3 rounded-full font-bold border transition ${index===0?'bg-primary text-white border-primary':'bg-white border-black/10'}`;tab.dataset.target=category.id;tab.textContent=category.label;menuTabs.appendChild(tab);const panel=document.createElement('div');panel.id=category.id;panel.className=`menu-panel ${index===0?'active':''}`;panel.innerHTML=`<div class="grid md:grid-cols-2 gap-4">${category.items.map(item=>`<div class="menu-card bg-white rounded-2xl p-6 flex justify-between gap-5 border border-black/5"><div><h3 class="font-bold">${item.name}</h3><p class="text-sm text-muted mt-2">${item.description}</p></div><p class="font-bold whitespace-nowrap">${item.price}</p></div>`).join('')}</div>`;menuPanels.appendChild(panel)});
  document.querySelectorAll('.menu-tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.menu-tab').forEach(t=>{t.classList.remove('bg-primary','text-white','border-primary');t.classList.add('bg-white','border-black/10')});tab.classList.add('bg-primary','text-white','border-primary');tab.classList.remove('bg-white','border-black/10');document.querySelectorAll('.menu-panel').forEach(panel=>panel.classList.remove('active'));document.getElementById(tab.dataset.target).classList.add('active')}));
  const galleryList=document.getElementById('galleryList'); Object.values(STORE.images).slice(5,9).forEach((image,index)=>{const img=document.createElement('img');img.src=image;img.alt=`${STORE.name} gallery ${index+1}`;img.className='h-52 md:h-72 object-cover rounded-2xl hover:scale-[1.02] transition';galleryList.appendChild(img)});
  const newsList=document.getElementById('newsList'); STORE.news.forEach(item=>{const article=document.createElement('article');article.className='news-card py-6 grid md:grid-cols-[150px_1fr] gap-3';article.innerHTML=`<time class="text-accent font-bold">${item.date}</time><div><h3 class="font-bold text-lg">${item.title}</h3><p class="text-muted mt-2">${item.text}</p></div>`;newsList.appendChild(article)});
  document.getElementById('accessName').textContent=STORE.name;document.getElementById('address').textContent=STORE.access.address;document.getElementById('phone').textContent=STORE.access.phone;document.getElementById('hours').textContent=STORE.access.hours;document.getElementById('closed').textContent=STORE.access.closed;document.getElementById('parking').textContent=STORE.access.parking;document.getElementById('mapLink').href=STORE.access.mapUrl;
  document.getElementById('contactPhoneText').textContent=STORE.contact.phone;document.getElementById('contactPhone').href=`tel:${STORE.contact.phone.replace(/[^0-9+]/g,'')}`;document.getElementById('contactEmailText').textContent=STORE.contact.email;document.getElementById('contactEmail').href=`mailto:${STORE.contact.email}`;document.getElementById('year').textContent=new Date().getFullYear();
  const header=document.getElementById('header');window.addEventListener('scroll',()=>{header.classList.toggle('header-scrolled',window.scrollY>20);const button=document.getElementById('backToTop');if(window.scrollY>500)button.classList.remove('opacity-0','pointer-events-none');else button.classList.add('opacity-0','pointer-events-none')});
  const menuButton=document.getElementById('menuButton'),mobileMenu=document.getElementById('mobileMenu');menuButton.addEventListener('click',()=>mobileMenu.classList.toggle('open'));mobileMenu.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>mobileMenu.classList.remove('open')));
  const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target)}}),{threshold:.12});document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));
  document.getElementById('backToTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
});
</script>
</body>
</html>
