<style>
:root{--ink:#0c0b09;--ink-2:#161310;--ink-3:#1e1a15;--gold:#b98a4e;--gold-soft:#e3c793;--cream:#f4efe4;--ink-on-cream:#16130d;--fg:#efe9dd;--fg-dim:#c7bea9;--fg-muted:#9c9484;--line:rgba(239,233,221,.09);--line-strong:rgba(239,233,221,.16);--font-display:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN",serif;--font-sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:var(--font-sans);background:var(--ink);background-image:radial-gradient(ellipse 900px 500px at 15% -10%,rgba(185,138,78,.10),transparent 60%),radial-gradient(ellipse 700px 500px at 100% 20%,rgba(185,138,78,.05),transparent 60%);color:var(--fg);line-height:1.85;font-weight:300;overflow-x:hidden;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}img,svg{max-width:100%;display:block}::selection{background:var(--gold);color:var(--ink)}:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
header{position:fixed;z-index:40;top:0;left:0;width:100%;padding:26px 6%;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(var(--ink) 0%,rgba(12,11,9,.75) 65%,transparent 100%)}.logo{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:.14em}nav{display:flex;gap:36px;font-size:13px;letter-spacing:.08em;color:var(--fg-dim)}nav a{position:relative;padding-bottom:4px;transition:color .3s var(--ease)}nav a::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;background:var(--gold);transition:right .35s var(--ease)}nav a:hover{color:var(--fg)}nav a:hover::after{right:0}.nav-toggle{display:none;background:none;border:0;color:var(--fg);width:34px;height:24px;position:relative;cursor:pointer}.nav-toggle span,.nav-toggle span::before,.nav-toggle span::after{content:"";position:absolute;left:0;width:100%;height:1px;background:var(--fg);transition:transform .3s var(--ease),opacity .3s var(--ease)}.nav-toggle span{top:11px}.nav-toggle span::before{top:-8px}.nav-toggle span::after{top:8px}.nav-toggle[aria-expanded="true"] span{background:transparent}.nav-toggle[aria-expanded="true"] span::before{transform:translateY(8px) rotate(45deg)}.nav-toggle[aria-expanded="true"] span::after{transform:translateY(-8px) rotate(-45deg)}
.hero{min-height:100vh;display:flex;align-items:center;position:relative;padding:150px 6% 100px;overflow:hidden}.hero-road{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.9}.hero-road path{fill:none;stroke:var(--gold);stroke-width:1;opacity:.45}.hero-road path.draw{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 2.6s var(--ease) .3s forwards}@keyframes draw{to{stroke-dashoffset:0}}.hero-inner{position:relative;z-index:1;max-width:780px}.eyebrow{color:var(--gold-soft);letter-spacing:.24em;font-size:12px;margin-bottom:26px;font-weight:500}h1{font-family:var(--font-display);font-weight:600;font-size:clamp(40px,7vw,88px);line-height:1.28;letter-spacing:.02em}h1 .lede{display:block;color:var(--gold-soft);font-size:.72em;margin-top:.15em}.hero p{margin-top:32px;color:var(--fg-dim);max-width:540px;font-size:16px;line-height:1.95}.btn{display:inline-block;margin-top:42px;position:relative;padding-bottom:10px;font-size:13px;letter-spacing:.14em;color:var(--fg);border-bottom:1px solid var(--line-strong)}.btn::after{content:"";position:absolute;left:0;bottom:-1px;width:0;height:1px;background:var(--gold);transition:width .4s var(--ease)}.btn:hover::after{width:100%}.btn:hover{color:var(--gold-soft)}
section{padding:130px 6%;border-top:1px solid var(--line);position:relative}.section-head{display:grid;grid-template-columns:1.1fr 1fr;gap:60px;margin-bottom:72px;align-items:end}.section-head h2{font-family:var(--font-display);font-weight:600;font-size:clamp(30px,4.4vw,52px);line-height:1.42}.section-head p{max-width:440px;color:var(--fg-muted);font-size:15px;line-height:1.95}.manifesto{font-family:var(--font-display);font-weight:500;font-size:clamp(26px,4vw,46px);line-height:1.7;max-width:900px;color:var(--fg-dim)}.manifesto b{font-weight:600;color:var(--fg)}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}.service{background:var(--ink);padding:44px 34px;transition:background .35s var(--ease)}.service:hover{background:var(--ink-2)}.service strong{font-size:11px;color:var(--gold);letter-spacing:.18em;font-weight:500}.service h3{font-family:var(--font-display);font-weight:600;font-size:26px;margin:22px 0 14px}.service p{color:var(--fg-muted);font-size:14.5px;line-height:1.9}
.path{position:relative;margin-top:20px}.path-line{position:absolute;top:19px;left:0;right:0;height:1px;background:var(--line-strong);z-index:0}.path-line i{position:absolute;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--gold)}.path-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:28px}.stage{padding-top:44px;position:relative}.stage::before{content:"";position:absolute;top:12px;left:0;width:13px;height:13px;border-radius:50%;background:var(--ink);border:1px solid var(--gold)}.stage .num{color:var(--gold);font-size:11px;letter-spacing:.16em;font-weight:500}.stage h3{font-family:var(--font-display);font-weight:600;font-size:23px;margin:16px 0 12px}.stage p{color:var(--fg-muted);font-size:14px;line-height:1.9}
.mission-wrap .manifesto{font-size:clamp(24px,3.6vw,40px)}.contact{background:var(--cream);color:var(--ink-on-cream);text-align:center}.contact .eyebrow{color:#8a6a37}.contact h2{font-family:var(--font-display);font-weight:600;font-size:clamp(34px,5.6vw,64px);line-height:1.4}.contact p{margin:26px auto 0;max-width:520px;color:#5c5546;font-size:15.5px;line-height:1.9}.contact .btn{color:var(--ink-on-cream);border-bottom-color:rgba(22,19,13,.25)}.contact .btn:hover{color:#8a6a37}footer{padding:36px 6%;display:flex;justify-content:space-between;align-items:center;color:var(--fg-muted);font-size:12px;border-top:1px solid var(--line)}footer .logo{font-size:16px}
@media(max-width:860px){nav{position:fixed;inset:0;top:0;background:var(--ink);flex-direction:column;justify-content:center;align-items:center;gap:34px;font-size:20px;transform:translateY(-100%);transition:transform .4s var(--ease)}nav.open{transform:translateY(0)}.nav-toggle{display:block;z-index:41}.services{grid-template-columns:1fr}.section-head{grid-template-columns:1fr}.path-grid{grid-template-columns:1fr 1fr;row-gap:44px}.path-line{display:none}}
@media(max-width:520px){.path-grid{grid-template-columns:1fr}section{padding:90px 7%}.hero{padding:130px 7% 80px}footer{flex-direction:column;gap:14px;text-align:center}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.hero-road path.draw{animation:none;stroke-dashoffset:0}.btn::after,nav a::after,.nav-toggle span,.nav-toggle span::before,.nav-toggle span::after,nav{transition:none}}
</style>
</head>
<body>
<header>
  <a class="logo" id="logo" href="#">ZENTO</a>
  <nav id="siteNav"></nav>
  <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="siteNav" aria-label="メニューを開く"><span></span></button>
</header>
<main>
<section class="hero"><svg class="hero-road" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><path class="draw" d="M -100 800 L 500 430 L 1300 800"/><path class="draw" d="M 150 800 L 500 500 L 950 800" style="animation-delay:.55s"/><path d="M 500 430 L 500 340" style="stroke-dasharray:2 10;opacity:.3"/></svg><div class="hero-inner"><div class="eyebrow" id="heroEyebrow"></div><h1><span id="heroTitle"></span><span class="lede" id="heroLede"></span></h1><p id="heroDescription"></p><a class="btn" id="heroCta" href="#contact"></a></div></section>
<section id="about"><div class="section-head"><h2 id="aboutTitle"></h2><p id="aboutDescription"></p></div><p class="manifesto" id="aboutManifesto"></p></section>
<section id="works"><div class="section-head"><h2 id="servicesTitle"></h2><p id="servicesDescription"></p></div><div class="services" id="servicesList"></div></section>
<section id="flow"><div class="section-head"><h2 id="flowTitle"></h2><p id="flowDescription"></p></div><div class="path"><div class="path-line"><i style="left:0"></i><i style="left:33.3%"></i><i style="left:66.6%"></i><i style="left:100%;transform:translateX(-100%)"></i></div><div class="path-grid" id="flowList"></div></div></section>
<section class="mission-wrap"><div class="section-head"><h2 id="missionTitle"></h2><p id="missionDescription"></p></div><p class="manifesto" id="missionLines"></p></section>
<section id="contact" class="contact"><div class="eyebrow" id="contactEyebrow"></div><h2 id="contactTitle"></h2><p id="contactDescription"></p><a class="btn" id="contactCta"></a></section>
</main>
<footer><div class="logo" id="footerBrand">ZENTO</div><div id="footerText"></div></footer>
<script type="module">
import ZENTO from './data/zento.js';

document.title=ZENTO.title;
document.querySelector('meta[name="description"]').content=ZENTO.description;
document.querySelector('meta[property="og:title"]').content=ZENTO.title;
document.querySelector('meta[property="og:description"]').content=ZENTO.description;
document.querySelector('meta[property="og:url"]').content=ZENTO.canonicalUrl;
document.querySelector('link[rel="canonical"]').href=ZENTO.canonicalUrl;
const $=id=>document.getElementById(id);
$('logo').textContent=ZENTO.brand;
$('siteNav').innerHTML=ZENTO.nav.map(x=>`<a href="${x.href}">${x.label}</a>`).join('');
$('heroEyebrow').textContent=ZENTO.hero.eyebrow;$('heroTitle').textContent=ZENTO.hero.title;$('heroLede').textContent=ZENTO.hero.lede;$('heroDescription').textContent=ZENTO.hero.description;$('heroCta').textContent=ZENTO.hero.cta;
$('aboutTitle').innerHTML=ZENTO.about.title;$('aboutDescription').textContent=ZENTO.about.description;$('aboutManifesto').innerHTML=ZENTO.about.manifesto.map((x,i)=>i%2?`<b>${x}</b>`:x).join('<br>');
$('servicesTitle').textContent=ZENTO.services.title;$('servicesDescription').textContent=ZENTO.services.description;$('servicesList').innerHTML=ZENTO.services.items.map(x=>`<div class="service"><strong>${x.label}</strong><h3>${x.title}</h3><p>${x.text}</p></div>`).join('');
$('flowTitle').textContent=ZENTO.flow.title;$('flowDescription').textContent=ZENTO.flow.description;$('flowList').innerHTML=ZENTO.flow.stages.map(x=>`<div class="stage"><div class="num">${x.num}</div><h3>${x.title}</h3><p>${x.text}</p></div>`).join('');
$('missionTitle').textContent=ZENTO.mission.title;$('missionDescription').textContent=ZENTO.mission.description;$('missionLines').innerHTML=`${ZENTO.mission.lines[0]}<br><b>${ZENTO.mission.lines[1]}</b><br>${ZENTO.mission.lines[2].replace('前途','<b>前途</b>')}`;
$('contactEyebrow').textContent=ZENTO.contact.eyebrow;$('contactTitle').innerHTML=ZENTO.contact.title;$('contactDescription').textContent=ZENTO.contact.description;$('contactCta').textContent=ZENTO.contact.cta;$('contactCta').href=`mailto:${ZENTO.contact.email}`;$('footerBrand').textContent=ZENTO.brand;$('footerText').textContent=ZENTO.footer;
const toggle=$('navToggle'),nav=$('siteNav');toggle.addEventListener('click',()=>{const open=nav.classList.toggle('open');toggle.setAttribute('aria-expanded',open?'true':'false')});nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{nav.classList.remove('open');toggle.setAttribute('aria-expanded','false')}));
</script>
</body>
</html>
